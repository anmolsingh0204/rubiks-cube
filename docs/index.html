<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Rubik's Cube Gallery</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            min-height: 100vh;
            padding: 2rem;
        }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { font-size: 2.5rem; margin-bottom: 0.5rem; background: linear-gradient(135deg, #fff, #58a6ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { color: #8b949e; margin-bottom: 2rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 1.5rem;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
        }
        .card:hover { transform: translateY(-4px); border-color: #58a6ff; box-shadow: 0 8px 24px rgba(88, 166, 255, 0.15); }
        .card h3 { font-size: 1.25rem; margin-bottom: 0.5rem; color: #58a6ff; }
        .card p { color: #8b949e; font-size: 0.9rem; margin-bottom: 1rem; }
        .tags { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
        .tag { background: #21262d; border: 1px solid #30363d; padding: 0.25rem 0.75rem; border-radius: 999px; font-size: 0.75rem; color: #8b949e; }
        .tag.exploded { background: rgba(255, 88, 0, 0.15); border-color: #ff5800; color: #ff5800; }
        .btn {
            display: inline-block;
            background: #238636;
            color: white;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        .btn:hover { background: #2ea043; }
        .btn.secondary { background: #1f6feb; }
        .btn.secondary:hover { background: #388bfd; }
        .btn-group { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        footer { margin-top: 3rem; text-align: center; color: #484f58; font-size: 0.85rem; }
        footer a { color: #58a6ff; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧩 3D Rubik's Cube Gallery</h1>
        <p class="subtitle">Interactive N×N×N cubes — rotate, zoom, explore. Generated with <a href="https://github.com/plotly/plotly.py" target="_blank" style="color:#58a6ff">Plotly</a>.</p>

        <div class="grid" id="gallery"></div>

        <footer>
            Built with <a href="https://github.com/yourusername/rubiks-cube" target="_blank">rubiks-cube</a> —
            <a href="https://github.com/yourusername/rubiks-cube" target="_blank">View Source</a>
        </footer>
    </div>

    <script>
        const cubes = [
            { size: 2, name: "2×2×2 Pocket Cube", files: { html: "rubiks_2x2x2.html", obj: "rubiks_2x2x2.obj" }, exploded: false },
            { size: 3, name: "3×3×3 Standard", files: { html: "rubiks_3x3x3.html", stl: "rubiks_3x3x3.stl", obj: "rubiks_3x3x3.obj" }, exploded: false },
            { size: 4, name: "4×4×4 Rubik's Revenge (Exploded)", files: { html: "rubiks_4x4x4_exploded.html", stl: "rubiks_4x4x4_exploded.stl", obj: "rubiks_4x4x4_exploded.obj" }, exploded: true },
            { size: 5, name: "5×5×5 Professor's Cube", files: { html: "rubiks_5x5x5.html", obj: "rubiks_5x5x5.obj" }, exploded: false },
        ];

        const gallery = document.getElementById('gallery');
        cubes.forEach(cube => {
            const card = document.createElement('div');
            card.className = 'card';
            const tags = [`${cube.size}×${cube.size}×${cube.size}`];
            if (cube.exploded) tags.push('<span class="tag exploded">Exploded</span>');
            const btns = [
                `<a href="${cube.files.html}" class="btn" target="_blank">🌐 Interactive</a>`,
            ];
            if (cube.files.stl) btns.push(`<a href="${cube.files.stl}" class="btn secondary" download>📦 STL</a>`);
            if (cube.files.obj) btns.push(`<a href="${cube.files.obj}" class="btn secondary" download>📐 OBJ</a>`);
            card.innerHTML = `
                <h3>${cube.name}</h3>
                <p>Standard Rubik's color scheme. ${cube.exploded ? 'Exploded view shows all internal faces.' : 'Only exterior faces colored (solved state).'}</p>
                <div class="tags">${tags.join('')}</div>
                <div class="btn-group">${btns.join('')}</div>
            `;
            gallery.appendChild(card);
        });
    </script>
</body>
</html>
